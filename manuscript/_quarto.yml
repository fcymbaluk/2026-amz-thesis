project:
  type: book
  output-dir: _book

book:
  title: "Eco-Social Policy and Environmental Governance in the Brazilian Amazon"
  author: "Fernando Cymbaluk"
  date: last-modified
  chapters:
    - index.qmd
    - ch1-theoretical.qmd
    - ch2-historical.qmd
    - ch3-systematic-review.qmd
    - ch4-causal-analysis.qmd
    - references.qmd
  # Appendix mechanism (carried from the old config). The single ch4 annex
  # (Stage 10) is listed here once it exists, e.g.:
  # appendices:
  #   - annex-variables.qmd

bibliography: references.bib
csl: apsa.csl         # apa.csl also available in manuscript/

lang: en              # switch to pt-BR per document if needed
number-sections: true
crossref:
  chapters: true

execute:
  freeze: auto        # cached chapter computations; re-runs only what changed

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
  docx:
    # For supervisor comment rounds. Style it once:
    # 1) quarto render --to docx, 2) edit styles in Word, save as reference.docx
    # 3) uncomment:
    # reference-doc: reference.docx
    toc: true
  pdf:
    pdf-engine: xelatex           # required for mainfont; pdflatex ignores it
    documentclass: scrreprt       # one-sided; switch to scrbook for double-sided print
    papersize: a4
    fontsize: 12pt
    linestretch: 1.5
    mainfont: "Times New Roman"
    toc: false                    # TOC/LoF/LoT placed manually in index.qmd
    number-sections: true
    colorlinks: true
    link-citations: true
    linkcolor: blue               # TOC/LoF/LoT kept black locally in index.qmd
    urlcolor: blue
    citecolor: blue
    filecolor: blue
    geometry:
      - margin=3cm
    # Placeholder LaTeX setup. The university thesis template will replace
    # this via a format extension (template-partials); see README
    # "Deferred upgrades".
